[project]
name = "video-recipe-analyzer"
version = "0.1.0"
description = "Extract ingredients and steps from recipe videos using computer vision and NLP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Deep Learning & Computer Vision
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",  # YOLOv8
    "opencv-python>=4.8.0",
    "easyocr>=1.7.0",
    # Speech & NLP
    "openai-whisper>=20230314",
    "spacy>=3.7.0",
    "ingredient-parser-nlp>=1.0.0",
    # Video Processing
    "yt-dlp>=2023.10.0",
    "ffmpeg-python>=0.2.0",
    # Experiment Tracking
    "mlflow>=2.8.0",
    # Data & Utilities
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
    "thefuzz>=0.20.0",  # Fuzzy string matching
    "python-levenshtein>=0.21.0",  # Speed up thefuzz
    # CLI
    "click>=8.1.0",
    "tqdm>=4.66.0",
    # Validation
    "jsonschema>=4.19.0",
    "transformers>=4.57.3",
    "timm>=1.0.22",
    "roboflow>=1.2.11",
    "python-dotenv>=1.2.1",
]

[project.scripts]
recipe-extract = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]
